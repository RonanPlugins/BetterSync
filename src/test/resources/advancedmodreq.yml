# AdvancedModreq plugin by SuperRonanCraft! #
# Have an issue, join our Discord page and get some help from the community or I at https://discord.gg/8Kt4wKm #

# Set to true if you would like to remove the update message.
Disable-Updater: false

Language-File: 'en.yml'

Settings:
  MinimumWords: 5
  # How many characters should we cut off the files in the "%ticket_msg%" of the "%ticket_resolved_msg%" placeholders
  MessageCutOff:
    Max: 32
    Suffix: '...'
  Importance:
    Enabled: true
  Rating:
    Enabled: true
    AllowNotResolved: false # Be able to rate closed tickets even if they we're not resolved
  Filter:
    Enabled: true
    Submitting:
      # Allow submitting even with blacklisted words? Will replace words with the substitute
      AllowSubmitting: true
      Substitute: '***'
    # List of all blacklisted words
    Blacklist:
      - 'dumb'
      - 'stupid'
      - 'crap'
  Cooldown: # Amount of time between making new tickets
    Enabled: true
    Time: 5 # In minutes
  Message-Delay: 30 # Time is seconds to stop listening to ticket creating message
  Debug: false
      
Notifications:
  ## Notification when a ticket is closed and the player is online
  Closed:
    Enabled: true
    ## More sounds at https://www.spigotmc.org/wiki/cc-sounds-list/
    ## Set sound to "'null'" if you don't want sounds!
    Sound: 'BLOCK_TRIPWIRE_CLICK_ON'
  ## Notification when a ticket is reopened and the player is online
  Opened:
    Enabled: true
    Sound: 'BLOCK_ANVIL_USE'
  ## Notification when a ticket is created and a staff member is online
  New:
    Enabled: true
    Sound: 'BLOCK_NOTE_BASEDRUM'
  ## Notification when a ticket is replied to and the player is online
  Reply:
    Enabled: true
    Sound: 'BLOCK_FIRE_EXTINGUISH'
  Join:
    ## Notification if one of their tickets was replied, closed or resolved and if 
    ## they have the permission "advancedmodreq.notifications.player"
    Player:
      Enabled: true
      Sound: 'ENTITY_SKELETON_HURT'
    ## Notification if any tickets are open, if the player has the permission "advancedmodreq.notifiations.opened"
    Opened:
      Enabled: true
      Sound: 'ENTITY_PLAYER_LEVELUP'
    Flagged:
      Enabled: true
      Sound: 'BLOCK_ANVIL_BREAK'
  Claim:
    Enabled: true
    Sound: 'BLOCK_TRIPWIRE_CLICK_OFF'
  Rated:
    Enabled: true
    Sound: 'BLOCK_ANVIL_USE'

Economy:
  Enabled: false
  Price: 25

Alias:
  Enabled: false
  List:
  - 'report'

Category:
  Enabled: true
  Categories:
    ## Add your own custom Categories!
    - Griefing:
      ## Description is the list that pops up when typing "/modreq categories" (Disabled if categories are disabled)
        Description:
          - '&6Griefing &f- &7Make a report based off a grief you''ve witnessed'
        Importance: 5 # Overrides importance, not allowing players to choose importance!
        Item: 'tnt'
    - Cheating:
        ## Description is the list that pops up when typing "/modreq categories" (Disabled if categories are disabled)
        Description:
          - '&6Cheating &f- &7Make a report based off a cheater you''ve witnessed'
        Importance: 5 # Overrides importance, not allowing players to choose importance!
        Item: 'iron_bars'
    - Other:
        Description:
          - '&6Other &f- &7Make a report based off anything else'
        Importance: 0 # Players can still choose an importance level!
        Item: 'anvil'

Template:
  Enabled: true
  Templates:
  ## Add your own custom Templates!
  - Grief:
      ## Auto populated fields
      Message: 'I just witnessed a griefer, please come help! Using a template'
      Importance: 0
      Item: 'diamond_pickaxe'
      Name: '&c&lGrief'
      Lore:
        - ''
        - '&7Make a general ticket'
        - '&7about a grief you'
        - '&7have witnessed/found'
      Category: 'Griefing'
  - Cheater:
      Message: 'There is a cheater on the server! Using a template'
      Importance: 5
      Item: 'feather'
      Name: '&d&lCheater'
      Lore:
        - ''
        - '&7Make a general ticket'
        - '&7about a cheater you saw!'
      Category: 'Cheater'
  - Hacker:
      Message: 'There is a hacker on the server! Using a template'
      Importance: 4
      Item: 'diamond'
      Name: '&5&lHacker'
      Lore:
        - ''
        - '&7Make a general ticket'
        - '&7about a cheater you saw!'
      Category: 'Cheater'

DefaultListFilters:
  - Opened: true